<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ibrar AI Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }
    .app {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    header {
      padding: 18px 0;
      text-align: center;
    }
    h1 { margin: 0 0 6px; }
    .subtitle { margin: 0; color: #6b7280; }
    #chat {
      flex: 1;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      min-height: 55vh;
      overflow-y: auto;
    }
    .msg {
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 14px;
      margin: 10px 0;
      white-space: pre-wrap;
      line-height: 1.45;
    }
    .user {
      margin-left: auto;
      background: #e8f0fe;
    }
    .assistant {
      background: #f1f3f5;
    }
    form {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      font-size: 16px;
      cursor: pointer;
    }
    #send {
      background: #2563eb;
      color: white;
    }
    #clear {
      background: #e5e7eb;
      color: #374151;
    }
    button:disabled { opacity: .6; cursor: wait; }
    @media (max-width: 600px) {
      form { flex-wrap: wrap; }
      input { flex-basis: 100%; }
      button { min-height: 44px; flex: 1; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Ibrar AI Assistant</h1>
      <p class="subtitle">Your own AI application</p>
    </header>

    <section id="chat" aria-live="polite"></section>

    <form id="chatForm">
      <input id="message" autocomplete="off" placeholder="Type your message..." />
      <button id="send" type="submit">Send</button>
      <button id="clear" type="button">Clear Chat</button>
    </form>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const clear = document.getElementById("clear");

    // Conversation memory for the current browser session.
    // The history is sent to the server with each message and is not
    // permanently saved by this frontend.
    const conversationHistory = [];

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showWelcomeMessage() {
      addMessage("Hello! I am Ibrar AI Assistant. How can I help you?", "assistant");
    }

    clear.addEventListener("click", () => {
      if (!conversationHistory.length) return;

      const confirmed = confirm("Clear this chat and start a new conversation?");
      if (!confirmed) return;

      conversationHistory.length = 0;
      chat.innerHTML = "";
      showWelcomeMessage();
      input.focus();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      conversationHistory.push({ role: "user", content: message });
      input.value = "";
      send.disabled = true;
      clear.disabled = true;

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            history: conversationHistory.slice(-20)
          })
        });

        const data = await response.json();
        const reply = data.reply || data.error || "No response.";
        addMessage(reply, "assistant");

        if (data.reply) {
          conversationHistory.push({ role: "assistant", content: data.reply });
        }
      } catch (error) {
        addMessage("Could not connect to the server.", "assistant");
      } finally {
        send.disabled = false;
        clear.disabled = false;
        input.focus();
      }
    });

    showWelcomeMessage();
  </script>
</body>
</html>
