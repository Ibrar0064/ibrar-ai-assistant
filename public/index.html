<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ibrar AI Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #1f2937; }
    .app { max-width: 1100px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 20px; }
    header { padding: 8px 0 18px; text-align: center; }
    h1 { margin: 0 0 6px; } .subtitle { margin: 0; color: #6b7280; }
    .workspace { flex: 1; display: grid; grid-template-columns: 250px 1fr; gap: 14px; min-height: 70vh; }
    .history-panel { background: white; border: 1px solid #e5e7eb; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; min-width: 0; }
    .history-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .history-header h2 { font-size: 17px; margin: 0; }
    #newChat, #renameSelected { color: white; min-height: 38px; padding: 0 12px; font-size: 14px; }
    #newChat { background: #2563eb; }
    #renameSelected { background: #059669; }
    #historySearch { width: 100%; margin: 0; padding: 10px 11px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 10px; }
    #searchChats { background: #7c3aed; color: white; min-height: 42px; padding: 0 14px; font-size: 14px; }
    .history-search { display: flex; gap: 7px; margin: 0 0 10px; }
    #historyList { overflow-y: auto; flex: 1; }
    .history-row { position: relative; margin-bottom: 8px; }\n    .history-item { width: 100%; text-align: left; background: #f8fafc; color: #374151; padding: 10px 82px 10px 11px; min-height: auto; border: 1px solid #e5e7eb; overflow: hidden; }
    .history-item.active { background: #e8f0fe; border-color: #93c5fd; }
    .history-title { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 22px; }
    .history-date { display: block; margin-top: 4px; font-size: 12px; color: #6b7280; }
    .history-actions { display: flex; gap: 4px; justify-content: flex-end; padding: 3px 2px 0; }
    .history-action { border: 1px solid #d1d5db; background: #f8fafc; color: #4b5563; padding: 4px 7px; font-size: 12px; min-height: auto; border-radius: 7px; }
    .history-action:hover { color: #2563eb; }
    .history-action.delete:hover { color: #dc2626; }
    .chat-area { display: flex; flex-direction: column; min-width: 0; }
    #chat { flex: 1; background: white; border: 1px solid #e5e7eb; border-radius: 16px; padding: 16px; min-height: 55vh; overflow-y: auto; }
    .msg { max-width: 85%; padding: 11px 14px; border-radius: 14px; margin: 10px 0; white-space: pre-wrap; line-height: 1.45; }
    .user { margin-left: auto; background: #e8f0fe; } .assistant { background: #f1f3f5; }
    form { display: flex; gap: 10px; margin-top: 14px; }
    input { flex: 1; min-width: 0; padding: 13px 14px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 16px; }
    button { border: 0; border-radius: 12px; padding: 0 16px; font-size: 15px; cursor: pointer; }
    #send { background: #2563eb; color: white; } #clear { background: #e5e7eb; color: #374151; } #save { background: #dbeafe; color: #1e40af; } #voice { background: #dcfce7; color: #166534; min-width: 48px; } #voiceConversation { background: #ede9fe; color: #6d28d9; min-width: 48px; } #voiceConversation.active { background: #ddd6fe; color: #5b21b6; } #voice.listening { background: #fee2e2; color: #991b1b; } #speak { background: #fef3c7; color: #92400e; min-width: 48px; } #speak.speaking { background: #fed7aa; }
    button:disabled { opacity: .6; cursor: wait; }
    .history-note { text-align: center; color: #6b7280; font-size: 13px; margin-top: 8px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
    .modal-backdrop.show { display: flex; }
    .rename-modal { width: min(420px, 100%); background: white; border-radius: 16px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
    .rename-modal h3 { margin: 0 0 12px; } .rename-modal p { margin: 0 0 12px; color: #6b7280; font-size: 14px; }
    #renameInput { width: 100%; margin: 0 0 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    #renameCancel { background: #e5e7eb; color: #374151; min-height: 42px; }
    #renameConfirm { background: #2563eb; color: white; min-height: 42px; }
    @media (max-width: 700px) {
      .workspace { grid-template-columns: 1fr; } .history-panel { max-height: 230px; } #historyList { max-height: 150px; }
      form { flex-wrap: wrap; } input { flex-basis: 100%; } form button { min-height: 44px; flex: 1; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header><h1>Ibrar AI Assistant</h1><p class="subtitle">Your own AI application</p></header>
    <div class="workspace">
      <aside class="history-panel">
        <div class="history-header"><h2>Chat History</h2><div style="display:flex;gap:6px;"><button id="renameSelected" type="button">Rename</button><button id="newChat" type="button">+ New Chat</button></div></div>
        <div class="history-search"><input id="historySearch" type="search" autocomplete="off" placeholder="Search chats..." aria-label="Search chat history" /><button id="searchChats" type="button">Search</button></div>
        <div id="historyList"></div>
      </aside>
      <section class="chat-area">
        <section id="chat" aria-live="polite"></section>
        <form id="chatForm">
          <input id="message" autocomplete="off" placeholder="Type your message..." />
          <button id="voice" type="button" title="Voice input">🎤</button><button id="agentMode" type="button" title="Toggle Agent Mode">🤖 Agent</button><button id="voiceConversation" type="button" title="Voice Conversation Mode">🎙️</button><button id="speak" type="button" title="Voice output">🔊</button><button id="send" type="submit">Send</button><button id="save" type="button">Save</button><button id="clear" type="button">Clear</button>
        </form>
        <div class="history-note">Your chat history is saved in this browser.</div>
      </section>
    </div>
  </main>

  <div id="renameBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="renameHeading">
    <div class="rename-modal">
      <h3 id="renameHeading">Rename Chat</h3>
      <p>Enter a new name for this conversation.</p>
      <input id="renameInput" maxlength="60" autocomplete="off" placeholder="Chat name" />
      <div class="modal-actions">
        <button id="renameCancel" type="button">Cancel</button>
        <button id="renameConfirm" type="button">Rename</button>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat"), form = document.getElementById("chatForm"), input = document.getElementById("message");
    const send = document.getElementById("send"), save = document.getElementById("save"), clear = document.getElementById("clear"), voice = document.getElementById("voice"), voiceConversation = document.getElementById("voiceConversation"), speak = document.getElementById("speak");
    const newChat = document.getElementById("newChat"), renameSelected = document.getElementById("renameSelected"), historyList = document.getElementById("historyList"), historySearch = document.getElementById("historySearch"), searchChats = document.getElementById("searchChats");
    const renameBackdrop = document.getElementById("renameBackdrop"), renameInput = document.getElementById("renameInput");
    const renameCancel = document.getElementById("renameCancel"), renameConfirm = document.getElementById("renameConfirm");
    const CHATS_KEY = "ibrar_ai_chat_history_v2", OLD_KEY = "ibrar_ai_chat_history_v1";
    let chats = [], activeChatId = null, conversationHistory = [], renameChatId = null;

    function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    function makeTitle(history) {
      const firstUser = history.find((item) => item.role === "user");
      if (!firstUser) return "New Chat";
      const clean = firstUser.content.replace(/\s+/g, " ").trim();
      return clean.length > 38 ? clean.slice(0, 38) + "…" : clean;
    }
    function formatDate(timestamp) {
      return new Date(timestamp).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }
    function persistChats() {
      try { localStorage.setItem(CHATS_KEY, JSON.stringify(chats.slice(-50))); return true; }
      catch (error) { return false; }
    }
    function renderChat() {
      chat.innerHTML = "";
      if (!conversationHistory.length) { addMessage("Hello! I am Ibrar AI Assistant. How can I help you?", "assistant"); return; }
      conversationHistory.forEach((item) => addMessage(item.content, item.role));
    }
    function addMessage(text, role) {
      const div = document.createElement("div"); div.className = "msg " + role; div.textContent = text; chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
    }
    function renderHistoryPanel() {
      historyList.innerHTML = "";
      const query = historySearch.value.trim().toLowerCase();
      const sorted = [...chats]
        .filter((item) => {
          if (!query) return true;
          const title = String(item.title || "").toLowerCase();
          const messages = item.messages.map((message) => String(message.content || "")).join(" ").toLowerCase();
          return title.includes(query) || messages.includes(query);
        })
        .sort((a,b) => b.updatedAt - a.updatedAt);
      if (!sorted.length) {
        const empty = document.createElement("div"); empty.textContent = query ? "No chats found." : "No saved chats yet."; empty.style.color="#6b7280"; empty.style.fontSize="13px"; empty.style.padding="10px 4px"; historyList.appendChild(empty); return;
      }
      sorted.forEach((item) => {
        const wrapper = document.createElement("div");
        const button = document.createElement("button"); button.type="button"; button.className="history-item" + (item.id===activeChatId ? " active" : "");
        const title=document.createElement("span"); title.className="history-title"; title.textContent=item.title;
        const date=document.createElement("span"); date.className="history-date"; date.textContent=formatDate(item.updatedAt);
        const actions=document.createElement("span"); actions.className="history-actions";
        const renameButton=document.createElement("button"); renameButton.type="button"; renameButton.className="history-action"; renameButton.textContent="Rename"; renameButton.title="Rename this chat";
        renameButton.addEventListener("click",(event)=>{event.stopPropagation(); openRename(item.id);});
        const deleteButton=document.createElement("button"); deleteButton.type="button"; deleteButton.className="history-action delete"; deleteButton.textContent="Delete"; deleteButton.title="Delete this chat";
        deleteButton.addEventListener("click",(event)=>{event.stopPropagation(); deleteChat(item.id);});
        actions.appendChild(renameButton); actions.appendChild(deleteButton);
        button.appendChild(title); button.appendChild(date);
        button.addEventListener("click",()=>loadChat(item.id));
        wrapper.appendChild(button); wrapper.appendChild(actions); historyList.appendChild(wrapper);
      });
    }
    function createChat() {
      const item={id:makeId(),title:"New Chat",createdAt:Date.now(),updatedAt:Date.now(),messages:[]};
      chats.push(item); activeChatId=item.id; conversationHistory=[]; persistChats(); renderChat(); renderHistoryPanel(); input.focus();
    }
    function loadChat(id) {
      const item=chats.find((chatItem)=>chatItem.id===id); if(!item)return;
      activeChatId=item.id; conversationHistory=item.messages.map((message)=>({role:message.role,content:message.content}));
      renderChat(); renderHistoryPanel(); input.focus();
    }
    function saveCurrentChat() {
      let item=chats.find((chatItem)=>chatItem.id===activeChatId);
      if(!item){item={id:makeId(),title:makeTitle(conversationHistory),createdAt:Date.now(),updatedAt:Date.now(),messages:[]};chats.push(item);activeChatId=item.id;}
      item.messages=conversationHistory.slice(-100).map((message)=>({role:message.role,content:message.content}));
      if (!item.customTitle) item.title=makeTitle(conversationHistory);
      item.updatedAt=Date.now(); const saved=persistChats(); renderHistoryPanel(); return saved;
    }
    function openRename(id) {
      const item=chats.find((chatItem)=>chatItem.id===id); if(!item)return;
      activeChatId=id; conversationHistory=item.messages.map((message)=>({role:message.role,content:message.content})); renderChat(); renderHistoryPanel();
      renameChatId=id; renameInput.value=item.title==="New Chat" ? "" : item.title; renameBackdrop.classList.add("show");
      setTimeout(()=>{renameInput.focus(); renameInput.select();},0);
    }
    function closeRename() { renameChatId=null; renameBackdrop.classList.remove("show"); renameInput.value=""; }
    function renameActiveChat() {
      if(!renameChatId)return;
      const item=chats.find((chatItem)=>chatItem.id===renameChatId); if(!item)return;
      const name=renameInput.value.replace(/\s+/g," ").trim();
      if(!name){alert("Please enter a chat name.");renameInput.focus();return;}
      item.title=name.slice(0,60); item.customTitle=true; item.updatedAt=Date.now(); persistChats(); renderHistoryPanel(); closeRename();
    }
    function deleteChat(id) {
      const item=chats.find((chatItem)=>chatItem.id===id); if(!item)return;
      if(!confirm("Delete this saved chat?"))return;
      chats=chats.filter((chatItem)=>chatItem.id!==id);
      if(activeChatId===id){ if(chats.length){const latest=[...chats].sort((a,b)=>b.updatedAt-a.updatedAt)[0];loadChat(latest.id);} else {activeChatId=null;conversationHistory=[];createChat();return;} }
      persistChats(); renderHistoryPanel();
    }
    function clearCurrentChat() {
      if(!conversationHistory.length)return;
      if(!confirm("Clear this chat and remove it from Chat History?"))return;
      chats=chats.filter((item)=>item.id!==activeChatId); persistChats(); activeChatId=null; conversationHistory=[]; createChat();
    }
    function migrateOldHistory() {
      try {
        const old=JSON.parse(localStorage.getItem(OLD_KEY)||"[]");
        if(Array.isArray(old)&&old.length){chats.push({id:makeId(),title:makeTitle(old),createdAt:Date.now(),updatedAt:Date.now(),messages:old.filter((item)=>item&&(item.role==="user"||item.role==="assistant")&&typeof item.content==="string").slice(-100)});}
        localStorage.removeItem(OLD_KEY);
      } catch(error){console.warn("Could not migrate previous chat history.",error);}
    }
    function loadAllChats() {
      try {
        const saved=JSON.parse(localStorage.getItem(CHATS_KEY)||"[]");
        if(Array.isArray(saved)){chats=saved.filter((item)=>item&&typeof item.id==="string"&&Array.isArray(item.messages));}
        if(!chats.length)migrateOldHistory();
      } catch(error){chats=[];}
      if(chats.length){const latest=[...chats].sort((a,b)=>b.updatedAt-a.updatedAt)[0];loadChat(latest.id);} else createChat();
      persistChats(); renderHistoryPanel();
    }
    // Voice Conversation Mode — browser speech recognition + existing AI chat + browser speech synthesis.
    // This version does not require an OpenAI API key.
    let voiceConversationActive = false;
    let voiceConversationRecognition = null;
    let voiceConversationSpeaking = false;

    function setVoiceConversationState(active, label) {
      voiceConversationActive = active;
      voiceConversation.classList.toggle("active", active);
      voiceConversation.textContent = active ? "⏹️" : "🎙️";
      voiceConversation.title = label || (active ? "Stop Voice Conversation" : "Voice Conversation Mode");
    }

    function startVoiceConversation() {
      if (!SpeechRecognition) {
        alert("Voice Conversation is not supported in this browser. Please use Chrome or another browser with speech recognition support.");
        return;
      }
      if (voiceConversationActive) return;

      voiceConversationRecognition = new SpeechRecognition();
      voiceConversationRecognition.continuous = true;
      voiceConversationRecognition.interimResults = false;
      voiceConversationRecognition.lang = navigator.language || "en-US";

      voiceConversationRecognition.onstart = () => {
        setVoiceConversationState(true, "Listening — speak now. Tap to stop.");
      };

      voiceConversationRecognition.onresult = async (event) => {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (!event.results[i].isFinal) continue;
          const transcript = event.results[i][0].transcript.trim();
          if (!transcript || voiceConversationSpeaking || send.disabled) continue;
          await processVoiceConversationMessage(transcript);
        }
      };

      voiceConversationRecognition.onerror = (event) => {
        console.warn("Voice Conversation error:", event.error);
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          alert("Microphone permission was denied. Please allow microphone access for this website.");
          stopVoiceConversation();
        }
      };

      voiceConversationRecognition.onend = () => {
        if (voiceConversationActive && !voiceConversationSpeaking) {
          try { voiceConversationRecognition.start(); } catch (_) {}
        }
      };

      try {
        voiceConversationRecognition.start();
      } catch (error) {
        console.warn("Could not start Voice Conversation.", error);
        setVoiceConversationState(false);
      }
    }

    function stopVoiceConversation() {
      voiceConversationActive = false;
      voiceConversationSpeaking = false;
      if (voiceConversationRecognition) {
        try { voiceConversationRecognition.stop(); } catch (_) {}
      }
      voiceConversationRecognition = null;
      if (SpeechSynthesis) SpeechSynthesis.cancel();
      setVoiceConversationState(false, "Voice Conversation Mode");
    }

    async function processVoiceConversationMessage(transcript) {
      if (!voiceConversationActive) return;
      addMessage("🎙️ " + transcript, "user");
      conversationHistory.push({role:"user", content:transcript});
      saveCurrentChat();
      send.disabled = true;
      clear.disabled = true;
      save.disabled = true;
      newChat.disabled = true;

      try {
        if (voiceConversationRecognition) {
          try { voiceConversationRecognition.stop(); } catch (_) {}
        }
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({message:transcript, history:conversationHistory.slice(-20)})
        });
        const data = await response.json();
        const reply = data.reply || data.error || "No response.";
        addMessage("🔊 " + reply, "assistant");
        if (data.reply) {
          conversationHistory.push({role:"assistant",content:data.reply});
          saveCurrentChat();
          if (voiceConversationActive) await speakVoiceConversation(reply);
        }
      } catch (error) {
        addMessage("Could not connect to the server.", "assistant");
        saveCurrentChat();
      } finally {
        send.disabled = false;
        clear.disabled = false;
        save.disabled = false;
        newChat.disabled = false;
        if (voiceConversationActive && !voiceConversationSpeaking && voiceConversationRecognition) {
          try { voiceConversationRecognition.start(); } catch (_) {}
        }
      }
    }

    function speakVoiceConversation(text) {
      return new Promise((resolve) => {
        if (!SpeechSynthesis || !text || !voiceConversationActive) { resolve(); return; }
        voiceConversationSpeaking = true;
        SpeechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = /[\\u0600-\\u06FF]/.test(text) ? "ur-PK" : (navigator.language || "en-US");
        utterance.rate = 1;
        utterance.pitch = 1;
        utterance.onend = () => { voiceConversationSpeaking = false; resolve(); };
        utterance.onerror = () => { voiceConversationSpeaking = false; resolve(); };
        SpeechSynthesis.speak(utterance);
      });
    }

    voiceConversation.addEventListener("click", () => {
      if (voiceConversationActive) stopVoiceConversation();
      else startVoiceConversation();
    });

    const SpeechSynthesis = window.speechSynthesis;
    let currentSpeech = null;

    function stopSpeaking() {
      if (SpeechSynthesis) SpeechSynthesis.cancel();
      currentSpeech = null;
      speak.classList.remove("speaking");
      speak.textContent = "🔊";
      speak.title = "Voice output";
    }

    function speakText(text) {
      if (!SpeechSynthesis || !text) {
        if (!SpeechSynthesis) alert("Voice output is not supported in this browser.");
        return;
      }
      stopSpeaking();
      currentSpeech = new SpeechSynthesisUtterance(text);
      currentSpeech.lang = /[\u0600-\u06FF]/.test(text) ? "ur-PK" : (navigator.language || "en-US");
      currentSpeech.rate = 1;
      currentSpeech.pitch = 1;
      currentSpeech.onstart = () => {
        speak.classList.add("speaking");
        speak.textContent = "⏹";
        speak.title = "Stop voice output";
      };
      currentSpeech.onend = stopSpeaking;
      currentSpeech.onerror = stopSpeaking;
      SpeechSynthesis.speak(currentSpeech);
    }

    speak.addEventListener("click", () => {
      if (SpeechSynthesis && SpeechSynthesis.speaking) stopSpeaking();
      else {
        const lastAssistant = [...conversationHistory].reverse().find((item) => item.role === "assistant");
        if (lastAssistant) speakText(lastAssistant.content);
        else alert("There is no AI response to read yet.");
      }
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    function setupVoiceInput() {
      if (!SpeechRecognition) {
        voice.disabled = true;
        voice.title = "Voice input is not supported in this browser.";
        return;
      }
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = navigator.language || "en-US";

      recognition.onstart = () => {
        isListening = true;
        voice.classList.add("listening");
        voice.textContent = "⏹";
        voice.title = "Stop voice input";
      };
      recognition.onresult = (event) => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        input.value = transcript;
      };
      recognition.onerror = (event) => {
        console.warn("Voice input error:", event.error);
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          alert("Microphone permission was denied. Please allow microphone access for this website.");
        }
      };
      recognition.onend = () => {
        isListening = false;
        voice.classList.remove("listening");
        voice.textContent = "🎤";
        voice.title = "Voice input";
      };
      voice.addEventListener("click", () => {
        if (isListening) {
          recognition.stop();
        } else {
          try { recognition.start(); }
          catch (error) { console.warn("Could not start voice input.", error); }
        }
      });
    }

    setupVoiceInput();
    save.addEventListener("click",()=>{if(!conversationHistory.length){alert("There is no chat to save yet.");return;} if(saveCurrentChat())alert("Chat saved successfully.");else alert("Could not save the chat.");});
    newChat.addEventListener("click",()=>{if(conversationHistory.length)saveCurrentChat();createChat();});
    clear.addEventListener("click",clearCurrentChat);
    renameConfirm.addEventListener("click",renameActiveChat);
    renameSelected.addEventListener("click",()=>{if(activeChatId)openRename(activeChatId);else alert("Please select a chat first.");});
    searchChats.addEventListener("click",renderHistoryPanel);
    historySearch.addEventListener("keydown",(event)=>{if(event.key==="Enter"){event.preventDefault();renderHistoryPanel();}});
    renameCancel.addEventListener("click",closeRename);
    renameBackdrop.addEventListener("click",(event)=>{if(event.target===renameBackdrop)closeRename();});
    renameInput.addEventListener("keydown",(event)=>{if(event.key==="Enter"){event.preventDefault();renameActiveChat();} if(event.key==="Escape"){event.preventDefault();closeRename();}});
    form.addEventListener("submit",async(event)=>{
      event.preventDefault(); const message=input.value.trim(); if(!message)return;
      addMessage(message,"user"); conversationHistory.push({role:"user",content:message}); saveCurrentChat(); input.value="";
      send.disabled=true;clear.disabled=true;save.disabled=true;newChat.disabled=true;
      try {
        const response=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history:conversationHistory.slice(-20)})});
        const data=await response.json(); const reply=data.reply||data.error||"No response."; addMessage(reply,"assistant");
        if(data.reply){conversationHistory.push({role:"assistant",content:data.reply});saveCurrentChat();}
      } catch(error){addMessage("Could not connect to the server.","assistant");saveCurrentChat();}
      finally{send.disabled=false;clear.disabled=false;save.disabled=false;newChat.disabled=false;input.focus();}
    });
    loadAllChats();
  </script>
</body>
</html>
